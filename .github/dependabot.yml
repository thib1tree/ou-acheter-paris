# Les actions des workflows sont épinglées par empreinte de commit : une
# étiquette (`v4`) se déplace, une empreinte non. Dependabot propose chaque
# mois une pull request quand une nouvelle version paraît ; la fusion
# automatique (fusion-auto.yml) la fusionne si la CI est verte.
#
# Les mises à jour mineures sont groupées en une pull request par écosystème ;
# une version majeure a la sienne : si elle casse la CI, elle reste ouverte
# (la veille la signale au bout de trois semaines) sans bloquer les autres.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: [minor, patch]
