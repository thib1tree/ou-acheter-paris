# Intégration continue et déploiement.
#
# Chaque push sur `main` et chaque pull request passent les mêmes contrôles
# qu'en local : construction du site statique (limites de Cloudflare Pages
# comprises), puis tous les tests. Le site ainsi testé — et lui seul — est
# ensuite déployé sur Cloudflare Pages : en production pour `main`, en
# prévisualisation pour une pull request. Un `main` rouge n'est jamais déployé.
#
# Pour `main`, la production n'est touchée qu'après un contrôle : le même site
# est d'abord publié à une adresse de contrôle, puis vérifié tel que Cloudflare
# le sert, fichiers et en-têtes (verifier_deploiement.py) et parcours dans un
# vrai navigateur (verifier_carte.py). Un échec arrête tout : la production
# reste sur la version précédente. Si la production échoue malgré tout à la
# même vérification, le déploiement précédent est rétabli.
#
# Le déploiement attend trois réglages du dépôt (voir le README) : les secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID, et la variable
# CLOUDFLARE_PROJECT_NAME. Tant qu'ils manquent, il est sauté, sans échec.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Relance à la main (onglet Actions) : premier déploiement, ou redéploiement.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Aucun jeton laissé dans `.git/config` : les étapes suivantes (pip,
      # tests) n'ont pas à pouvoir écrire dans le dépôt.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      - name: Dépendances
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.txt

      - name: Navigateur des tests de bout en bout
        run: python -m playwright install --with-deps chromium

      - name: Analyse statique (Python)
        run: python -m pyflakes src scripts tests

      # Les workflows eux-mêmes : syntaxe, expressions, et shellcheck sur chaque
      # `run:`. Un workflow invalide ne tourne pas du tout : il ne rougit même
      # pas, et la maintenance automatique s'arrête en silence. Le binaire
      # officiel est vérifié par son empreinte, comme les paquets Python.
      - name: Analyse des workflows (actionlint)
        env:
          VERSION: "1.7.12"
          EMPREINTE: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive"
          echo "$EMPREINTE  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Syntaxe du JavaScript (carte et site)
        run: for f in site/*.js site/carte/carte.js; do node --check "$f"; done

      - name: Construction du site statique (et limites de Cloudflare Pages)
        env:
          # Adresse de production (adresse canonique, apercus de partage, plan
          # du site) : celle ecrite dans construire_site.py, sauf si la
          # variable ADRESSE_SITE la remplace.
          ADRESSE_SITE: ${{ vars.ADRESSE_SITE }}
        run: python scripts/construire_site.py --sortie dist

      - name: Site construit, pour le déploiement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

      - name: Tests
        env:
          # Aucun appel réseau en CI : tout ce que la carte affiche est
          # versionné dans le dépôt.
          DVF_RESEAU: "0"
          # Un navigateur absent fait echouer les tests de la carte au lieu
          # de les ignorer.
          NAVIGATEUR_OBLIGATOIRE: "1"
        run: python -m pytest -q

  deployer:
    needs: tests
    # Les pull requests venues d'un fork n'ont pas accès aux secrets.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PROJET: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      # Branche de production du projet Pages : `main`. Toute autre branche
      # donne une prévisualisation, à l'adresse <branche>.<projet>.pages.dev.
      BRANCHE: ${{ github.head_ref || github.ref_name }}
    steps:
      # Le nom de branche et celui du projet finissent dans une ligne de
      # commande (wrangler) : ils n'y entrent que réduits à des caractères
      # sans effet pour un shell.
      - name: Réglages Cloudflare présents ?
        id: reglages
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPTE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projet=$(printf '%s' "$PROJET" | tr -cd 'a-z0-9-')
          branche=$(printf '%s' "$BRANCHE" | tr -c 'A-Za-z0-9._-' '-')
          echo "projet=$projet" >> "$GITHUB_OUTPUT"
          echo "branche=$branche" >> "$GITHUB_OUTPUT"
          if [ -n "$JETON" ] && [ -n "$COMPTE" ] && [ -n "$projet" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Déploiement sauté::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ou variable CLOUDFLARE_PROJECT_NAME absents (voir le README)."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.reglages.outputs.pret == 'oui'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.reglages.outputs.pret == 'oui'
        with:
          name: site
          path: dist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.reglages.outputs.pret == 'oui'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Navigateur de vérification
        if: steps.reglages.outputs.pret == 'oui'
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Le projet est créé au premier déploiement, avec `main` pour branche de
      # production ; ensuite, cette étape échoue sans conséquence (il existe).
      - name: Projet Cloudflare Pages
        if: steps.reglages.outputs.pret == 'oui'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ steps.reglages.outputs.projet }} --production-branch=main

      # Contrôle avant la production : le même site, à une adresse de
      # prévisualisation (branche `controle`), vérifié comme le visiteur le
      # verra. Rien ne va en production s'il échoue.
      - name: Déploiement de contrôle
        id: controle
        if: steps.reglages.outputs.pret == 'oui' && steps.reglages.outputs.branche == 'main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name=${{ steps.reglages.outputs.projet }}
            --branch=controle --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Vérification de contrôle
        if: steps.reglages.outputs.pret == 'oui' && steps.reglages.outputs.branche == 'main'
        env:
          ADRESSE: ${{ steps.controle.outputs.deployment-url }}
        run: |
          set -o pipefail
          python scripts/verifier_deploiement.py "$ADRESSE" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/verifier_carte.py "$ADRESSE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Déploiement
        id: deploiement
        if: steps.reglages.outputs.pret == 'oui'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist --project-name=${{ steps.reglages.outputs.projet }}
            --branch=${{ steps.reglages.outputs.branche }} --commit-hash=${{ github.sha }}
            --commit-dirty=true

      # Le site répond-il, et Cloudflare le sert-il comme prévu (compression,
      # cache des données) ? Le résultat va dans le résumé du job.
      - name: Vérification du site déployé
        id: verification
        if: steps.reglages.outputs.pret == 'oui'
        env:
          ADRESSE: ${{ steps.deploiement.outputs.deployment-url }}
        run: |
          set -o pipefail
          python scripts/verifier_deploiement.py "$ADRESSE" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/verifier_carte.py "$ADRESSE" | tee -a "$GITHUB_STEP_SUMMARY"

      # Le cas rare : contrôle réussi, production ratée. Retour à la version
      # précédente ; la CI reste rouge, et la veille le signale.
      - name: Retour à la version précédente
        if: >-
          failure() && steps.verification.outcome == 'failure'
          && steps.reglages.outputs.branche == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJET: ${{ steps.reglages.outputs.projet }}
          ADRESSE: ${{ steps.deploiement.outputs.deployment-url }}
        run: python scripts/retablir_production.py "$PROJET" "$ADRESSE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Adresse de prévisualisation dans la pull request
        if: steps.reglages.outputs.pret == 'oui' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADRESSE: ${{ steps.deploiement.outputs.pages-deployment-alias-url || steps.deploiement.outputs.deployment-url }}
        with:
          script: |
            const marque = "<!-- previsualisation-cloudflare -->";
            const corps = `${marque}\n**Prévisualisation** : ${process.env.ADRESSE}\n\n` +
              `Commit ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const commentaires = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const ancien = commentaires.find((c) => c.body && c.body.includes(marque));
            if (ancien) await github.rest.issues.updateComment({ owner, repo, comment_id: ancien.id, body: corps });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: corps });

  # Un `main` rouge (tests, contrôle avant production, déploiement) prévient
  # tout de suite par une issue `veille`, que la veille refermera d'elle-même
  # quand `main` sera redevenu vert. La production, elle, n'a pas bougé.
  signaler:
    needs: [tests, deployer]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "La CI de \`main\` a échoué : $RUN"
            echo
            echo "Le site en ligne n'a pas changé : il reste sur sa dernière version vérifiée."
            echo "Plus rien n'est fusionné automatiquement tant que \`main\` est rouge."
          } > "$RUNNER_TEMP/issue.md"
          scripts/signaler.sh veille "Veille : le site demande votre attention" "$RUNNER_TEMP/issue.md"
