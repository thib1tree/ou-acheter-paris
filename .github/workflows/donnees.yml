# Mise à jour des données DVF, quasi automatique.
#
# Etalab republie les DVF géolocalisées deux fois par an. Chaque mois, ce
# workflow regarde s'il y a du neuf (nouveau millésime, ou fichiers révisés) :
#
# - rien de neuf : il s'arrête là, sans rien écrire ;
# - du neuf : il fait glisser la fenêtre d'années, reprépare le territoire,
#   récupère les contours manquants, reconstruit le site, lance tous les
#   tests, puis ouvre une pull request dont la description résume ce qui
#   change. La CI de cette pull request publie une prévisualisation, et la
#   fusion automatique (fusion-auto.yml) la fusionne si tout est vert ;
# - un garde-fou levé (écart qu'un glissement de fenêtre n'explique pas) :
#   la pull request porte l'étiquette `a-verifier`, qui retient la fusion,
#   et une issue prévient ;
# - un échec : il ouvre une issue avec le journal (ou la complète si elle
#   est déjà ouverte).
#
# Le secret JETON_MISE_A_JOUR (jeton personnel à droits fins, voir le README)
# sert à pousser la branche et ouvrir la pull request : une pull request
# ouverte avec le jeton par défaut de GitHub Actions ne déclencherait pas la
# CI. Sans lui, le workflow se rabat sur ce jeton par défaut.
#
# Ce jeton peut modifier les workflows : il n'est donné qu'aux deux étapes
# qui parlent à GitHub (branche, pull request), jamais à celles qui installent
# des paquets, lisent les fichiers d'Etalab ou lancent les tests. Le dépôt est
# extrait sans jeton (`persist-credentials: false`) ; `scripts/git_jeton.sh`
# le passe à git le temps d'une commande.
name: Mise à jour des données

on:
  schedule:
    # Le 3 de chaque mois à 5 h 17 UTC : une publication est vue au plus un
    # mois après sa mise en ligne.
    - cron: "17 5 3 * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Tout reconstruire même si Etalab n'a rien publié de neuf"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mise-a-jour-donnees
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TERRITOIRE: grand-paris
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      - name: Dépendances
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.txt

      - name: Etalab a-t-il publié du neuf ?
        id: verif
        run: |
          set -o pipefail
          python scripts/verifier_millesime.py --territoire "$TERRITOIRE" \
            --etat "$RUNNER_TEMP/etat.json" 2>&1 | tee -a "$RUNNER_TEMP/journal.txt"

      - name: Branche de mise à jour
        id: branche
        if: steps.verif.outputs.nouveau == 'oui' || inputs.forcer
        # Ce qui vient d'Etalab (le millésime) passe par l'environnement, jamais
        # par une substitution dans le script : lu sur un serveur tiers, il ne
        # doit pas pouvoir devenir une commande.
        env:
          GH_TOKEN: ${{ secrets.JETON_MISE_A_JOUR || github.token }}
          MILLESIME: ${{ steps.verif.outputs.millesime }}
          FORCER: ${{ inputs.forcer }}
          RUN_ID: ${{ github.run_id }}
        run: |
          empreinte=$(sha256sum "$RUNNER_TEMP/etat.json" | cut -c1-8)
          millesime=$(printf '%s' "$MILLESIME" | tr -cd '0-9A-Za-z._-')
          branche="donnees/$millesime-$empreinte"
          if [ "$FORCER" = "true" ]; then branche="$branche-$RUN_ID"; fi
          echo "nom=$branche" >> "$GITHUB_OUTPUT"
          # Une branche déjà poussée pour ce même état : sa pull request attend
          # une relecture, on ne la refait pas chaque mois.
          if scripts/git_jeton.sh ls-remote --exit-code --heads origin "$branche" > /dev/null; then
            echo "::notice title=Déjà proposé::La branche $branche existe : sa pull request attend une relecture."
          else
            echo "lancer=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparation du territoire (DVF géolocalisées)
        if: steps.branche.outputs.lancer == 'oui'
        env:
          ANNEES: ${{ steps.verif.outputs.annees }}
        run: |
          set -o pipefail
          cp "data/territoires/$TERRITOIRE/mutations.parquet" "$RUNNER_TEMP/ancien.parquet"
          # Les ventes seules : les contours versionnés restent, et l'étape
          # suivante ne télécharge que ceux qui manquent.
          python scripts/preparer_territoire.py --territoire "$TERRITOIRE" --sans-contours \
            --annees "$ANNEES" 2>&1 | tee -a "$RUNNER_TEMP/journal.txt"

      - name: Contours manquants
        if: steps.branche.outputs.lancer == 'oui'
        run: |
          # Des sections encore sans contour ne bloquent pas : elles sont
          # listées dans la pull request, et les tests bornent leur nombre.
          python scripts/preparer_deploiement.py --territoire "$TERRITOIRE" \
            2>&1 | tee -a "$RUNNER_TEMP/journal.txt" || true
          python scripts/verifier_millesime.py --territoire "$TERRITOIRE" \
            --adopter "$RUNNER_TEMP/etat.json"

      - name: Construction du site
        if: steps.branche.outputs.lancer == 'oui'
        run: |
          set -o pipefail
          python scripts/construire_site.py --sortie dist 2>&1 | tee -a "$RUNNER_TEMP/journal.txt"

      - name: Navigateur des tests de bout en bout
        if: steps.branche.outputs.lancer == 'oui'
        run: python -m playwright install --with-deps chromium

      - name: Tests
        if: steps.branche.outputs.lancer == 'oui'
        env:
          DVF_RESEAU: "0"
          NAVIGATEUR_OBLIGATOIRE: "1"
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee -a "$RUNNER_TEMP/journal.txt"

      # La description dit ce qui change, et lève les garde-fous (écarts
      # qu'un glissement de fenêtre n'explique pas) : sortie `a_verifier`.
      - name: Description et garde-fous
        id: description
        if: steps.branche.outputs.lancer == 'oui'
        env:
          MILLESIME: ${{ steps.verif.outputs.millesime }}
          RAISONS: ${{ steps.verif.outputs.raisons }}
        run: |
          python scripts/resumer_mise_a_jour.py --territoire "$TERRITOIRE" \
            --ancien "$RUNNER_TEMP/ancien.parquet" --millesime "$MILLESIME" \
            --raisons "$RAISONS" > "$RUNNER_TEMP/description.md"
          cat "$RUNNER_TEMP/description.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull request
        if: steps.branche.outputs.lancer == 'oui'
        env:
          GH_TOKEN: ${{ secrets.JETON_MISE_A_JOUR || github.token }}
          BRANCHE: ${{ steps.branche.outputs.nom }}
          MILLESIME: ${{ steps.verif.outputs.millesime }}
          RAISONS: ${{ steps.verif.outputs.raisons }}
          BASE: ${{ github.event.repository.default_branch }}
          A_VERIFIER: ${{ steps.description.outputs.a_verifier }}
          # Les issues s'ouvrent avec le jeton par défaut : il en a le droit.
          JETON_DEFAUT: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          git add data/
          if git diff --cached --quiet; then
            echo "::notice title=Rien à proposer::Les fichiers régénérés sont identiques à ceux de main."
            exit 0
          fi
          git commit -q -m "Données DVF : millésime $MILLESIME" -m "$RAISONS"
          scripts/git_jeton.sh push -u origin "$BRANCHE"
          # Un garde-fou levé retient la fusion automatique (étiquette
          # `a-verifier`), et une issue prévient : la pull request, ouverte
          # avec le jeton personnel, ne notifie pas son propre auteur.
          etiquette=()
          if [ "$A_VERIFIER" = "oui" ]; then
            gh label create a-verifier --color FBCA04 \
              --description "Fusion automatique retenue : à vérifier" 2>/dev/null || true
            etiquette=(--label a-verifier)
          fi
          adresse=$(gh pr create --base "$BASE" --head "$BRANCHE" "${etiquette[@]}" \
            --title "Données DVF : millésime $MILLESIME" --body-file "$RUNNER_TEMP/description.md")
          if [ "$A_VERIFIER" = "oui" ]; then
            printf 'La mise à jour des données lève un garde-fou : %s\n\nVérifier la prévisualisation, puis fusionner la pull request (ou la fermer).\n' \
              "$adresse" > "$RUNNER_TEMP/verifier.md"
            GH_TOKEN="$JETON_DEFAUT" scripts/signaler.sh mise-a-jour-donnees \
              "Mise à jour des données à vérifier" "$RUNNER_TEMP/verifier.md"
          fi

      - name: Issue en cas d'échec
        if: failure()
        env:
          # Les issues s'ouvrent avec le jeton par défaut : il en a le droit.
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titre="Mise à jour des données DVF en échec"
          {
            echo "La mise à jour automatique des données a échoué : $RUN"
            echo
            echo "Dernières lignes du journal :"
            echo
            echo '```'
            tail -n 150 "$RUNNER_TEMP/journal.txt" 2>/dev/null || echo "(journal vide)"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          scripts/signaler.sh mise-a-jour-donnees "$titre" "$RUNNER_TEMP/issue.md"
