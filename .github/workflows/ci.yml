# Intégration continue et déploiement.
#
# Chaque push sur `main` et chaque pull request passent les mêmes contrôles
# qu'en local : construction du site statique (limites de Cloudflare Pages
# comprises), puis tous les tests. Le site ainsi testé — et lui seul — est
# ensuite déployé sur Cloudflare Pages : en production pour `main`, en
# prévisualisation pour une pull request. Un `main` rouge n'est jamais déployé.
#
# Le déploiement attend trois réglages du dépôt (voir le README) : les secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID, et la variable
# CLOUDFLARE_PROJECT_NAME. Tant qu'ils manquent, il est sauté, sans échec.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Relance à la main (onglet Actions) : premier déploiement, ou redéploiement.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      - name: Navigateur des tests de bout en bout
        run: python -m playwright install --with-deps chromium

      - name: Analyse statique (Python)
        run: python -m pyflakes src scripts tests

      - name: Syntaxe du JavaScript (carte et site)
        run: for f in site/*.js site/carte/carte.js; do node --check "$f"; done

      - name: Construction du site statique (et limites de Cloudflare Pages)
        env:
          # Adresse de production (adresse canonique, apercus de partage, plan
          # du site) : celle ecrite dans construire_site.py, sauf si la
          # variable ADRESSE_SITE la remplace.
          ADRESSE_SITE: ${{ vars.ADRESSE_SITE }}
        run: python scripts/construire_site.py --sortie dist

      - name: Site construit, pour le déploiement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7

      - name: Tests
        env:
          # Aucun appel réseau en CI : tout ce que la carte affiche est
          # versionné dans le dépôt.
          DVF_RESEAU: "0"
          # Un navigateur absent fait echouer les tests de la carte au lieu
          # de les ignorer.
          NAVIGATEUR_OBLIGATOIRE: "1"
        run: python -m pytest -q

  deployer:
    needs: tests
    # Les pull requests venues d'un fork n'ont pas accès aux secrets.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PROJET: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      # Branche de production du projet Pages : `main`. Toute autre branche
      # donne une prévisualisation, à l'adresse <branche>.<projet>.pages.dev.
      BRANCHE: ${{ github.head_ref || github.ref_name }}
    steps:
      # Le nom de branche et celui du projet finissent dans une ligne de
      # commande (wrangler) : ils n'y entrent que réduits à des caractères
      # sans effet pour un shell.
      - name: Réglages Cloudflare présents ?
        id: reglages
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPTE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projet=$(printf '%s' "$PROJET" | tr -cd 'a-z0-9-')
          branche=$(printf '%s' "$BRANCHE" | tr -c 'A-Za-z0-9._-' '-')
          echo "projet=$projet" >> "$GITHUB_OUTPUT"
          echo "branche=$branche" >> "$GITHUB_OUTPUT"
          if [ -n "$JETON" ] && [ -n "$COMPTE" ] && [ -n "$projet" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Déploiement sauté::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ou variable CLOUDFLARE_PROJECT_NAME absents (voir le README)."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.reglages.outputs.pret == 'oui'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.reglages.outputs.pret == 'oui'
        with:
          name: site
          path: dist

      # Le projet est créé au premier déploiement, avec `main` pour branche de
      # production ; ensuite, cette étape échoue sans conséquence (il existe).
      - name: Projet Cloudflare Pages
        if: steps.reglages.outputs.pret == 'oui'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ steps.reglages.outputs.projet }} --production-branch=main

      - name: Déploiement
        id: deploiement
        if: steps.reglages.outputs.pret == 'oui'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist --project-name=${{ steps.reglages.outputs.projet }}
            --branch=${{ steps.reglages.outputs.branche }} --commit-hash=${{ github.sha }}
            --commit-dirty=true

      # Le site répond-il, et Cloudflare le sert-il comme prévu (compression,
      # cache des données) ? Le résultat va dans le résumé du job.
      - name: Vérification du site déployé
        if: steps.reglages.outputs.pret == 'oui'
        env:
          ADRESSE: ${{ steps.deploiement.outputs.deployment-url }}
        run: |
          python3 scripts/verifier_deploiement.py "$ADRESSE" >> "$GITHUB_STEP_SUMMARY"

      - name: Adresse de prévisualisation dans la pull request
        if: steps.reglages.outputs.pret == 'oui' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADRESSE: ${{ steps.deploiement.outputs.pages-deployment-alias-url || steps.deploiement.outputs.deployment-url }}
        with:
          script: |
            const marque = "<!-- previsualisation-cloudflare -->";
            const corps = `${marque}\n**Prévisualisation** : ${process.env.ADRESSE}\n\n` +
              `Commit ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const commentaires = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const ancien = commentaires.find((c) => c.body && c.body.includes(marque));
            if (ancien) await github.rest.issues.updateComment({ owner, repo, comment_id: ancien.id, body: corps });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: corps });
